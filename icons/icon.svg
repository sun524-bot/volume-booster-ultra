<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Speaker Body -->
  <g filter="url(#glow)">
    <polygon points="56,36 34,52 18,52 18,76 34,76 56,92" fill="#ffffff"/>
    
    <!-- Sound Waves with dynamic gradient -->
    <path d="M72,48 Q84,64 72,80" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M86,38 Q104,64 86,90" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M100,28 Q124,64 100,100" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
