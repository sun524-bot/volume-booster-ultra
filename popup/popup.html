<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volume Booster Ultra</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="glass-card">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Volume Booster</h1>
          <span class="badge">ULTRA 600%</span>
        </div>
      </div>
      <div id="statusIndicator" class="status-indicator active" title="Active on this tab">
        <span class="dot"></span>
        <span class="status-label">READY</span>
      </div>
    </header>

    <!-- Main Gauge & Number Display -->
    <main class="main-display">
      <div class="gauge-container">
        <!-- SVG Circular Ring -->
        <svg class="gauge-ring" viewBox="0 0 160 160">
          <circle class="ring-bg" cx="80" cy="80" r="68"></circle>
          <circle id="gaugeProgress" class="ring-fill" cx="80" cy="80" r="68"></circle>
        </svg>
        
        <div class="gauge-content">
          <div class="volume-value-wrapper">
            <span id="volumeValue" class="volume-value">100</span>
            <span class="volume-unit">%</span>
          </div>
          <span id="volumeTier" class="volume-tier">NORMAL</span>
        </div>
      </div>

      <!-- Live VU Equalizer Visualizer -->
      <div class="visualizer-container" id="visualizer">
        <div class="vu-bar"><div class="vu-bar-fill"></div></div>
        <div class="vu-bar"><div class="vu-bar-fill"></div></div>
        <div class="vu-bar"><div class="vu-bar-fill"></div></div>
        <div class="vu-bar"><div class="vu-bar-fill"></div></div>
        <div class="vu-bar"><div class="vu-bar-fill"></div></div>
        <div class="vu-bar"><div class="vu-bar-fill"></div></div>
      </div>

      <!-- Volume Range Slider -->
      <div class="slider-wrapper">
        <div class="slider-labels">
          <span>0%</span>
          <span class="baseline">100%</span>
          <span>300%</span>
          <span class="max-label">600%</span>
        </div>
        <input 
          type="range" 
          id="volumeSlider" 
          min="0" 
          max="600" 
          step="5" 
          value="100" 
          aria-label="Volume Booster Slider"
        />
      </div>

      <!-- Quick Preset Pills -->
      <div class="presets-grid">
        <button class="preset-btn" data-val="100">100%</button>
        <button class="preset-btn" data-val="200">200%</button>
        <button class="preset-btn" data-val="400">400%</button>
        <button class="preset-btn max-preset" data-val="600">600% 🔥</button>
      </div>
    </main>

    <!-- Quick Action Controls -->
    <footer class="controls-footer">
      <button id="muteBtn" class="action-btn mute-btn" title="Toggle Mute Active Tab">
        <svg class="icon-unmuted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <svg class="icon-muted" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
        <span id="muteLabel">Mute</span>
      </button>

      <button id="resetBtn" class="action-btn reset-btn" title="Reset to 100%">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        <span>Reset</span>
      </button>

      <button id="powerBtn" class="action-btn power-btn" title="Turn Off Booster on this Tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
        <span>Detach</span>
      </button>
    </footer>

    <!-- Multi-Tab Audio Manager Section (Expandable Drawer) -->
    <section class="multi-tab-section">
      <button id="drawerToggleBtn" class="drawer-toggle-btn" aria-expanded="false">
        <div class="toggle-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
          <span>Multi-Tab Audio Manager</span>
        </div>
        <div class="toggle-right">
          <span id="audibleBadge" class="audible-pill" title="Audible tabs">0 other</span>
          <svg id="chevronIcon" class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </button>

      <div id="drawerContent" class="drawer-content collapsed">
        <!-- Bulk Muting Action Grid -->
        <div class="bulk-actions-grid">
          <button id="btnMuteOthersWindow" class="bulk-btn" title="Mute other tabs in this window (Alt+Shift+M)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
            </svg>
            <span>Mute Others (This Win)</span>
          </button>

          <button id="btnMuteOtherWindows" class="bulk-btn" title="Mute all tabs in other browser windows">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="2" width="13" height="13" rx="2"></rect>
              <path d="M7 17h12a2 2 0 0 0 2-2V7"></path>
            </svg>
            <span>Mute Other Windows</span>
          </button>

          <button id="btnMuteAllOthersGlobal" class="bulk-btn danger" title="Mute all other tabs across ALL windows except this active tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>Mute All Except Active</span>
          </button>

          <button id="btnUnmuteAll" class="bulk-btn success" title="Unmute all tabs in all windows (Alt+Shift+U)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <span>Unmute All</span>
          </button>
        </div>

        <!-- Auto Solo Focus Mode Switch -->
        <div class="focus-mode-card">
          <div class="focus-text">
            <strong>Auto Solo / Focus Mode</strong>
            <p>Auto-mutes other tabs when active tab plays sound</p>
          </div>
          <label class="switch">
            <input type="checkbox" id="autoSoloToggle">
            <span class="switch-slider"></span>
          </label>
        </div>

        <!-- Live Audible Tabs List -->
        <div class="audible-list-section">
          <div class="list-header">
            <span>AUDIBLE / PLAYING TABS</span>
            <button id="refreshTabsBtn" class="refresh-icon-btn" title="Refresh tab list">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
              </svg>
            </button>
          </div>
          <div id="audibleTabsContainer" class="audible-tabs-container">
            <div class="empty-state">No other audible tabs found</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Anti-Clipping Indicator Tag -->
    <div class="dynamics-indicator">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
      </svg>
      <span>Anti-Clipping Dynamics Compressor Active</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
